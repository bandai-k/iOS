name: CI

on:
  # ブランチ名を書くと、既定のブランチ名が違うリポジトリで一度も走らなくなるため、
  # push は全ブランチを対象にする。
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Test shared packages
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: make test

  apps:
    name: Build ${{ matrix.app }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        # アプリを追加したらここにも名前を足す。
        app: [TimeZONE, SiteRecord, Sengiri, Speedometer]
    steps:
      - uses: actions/checkout@v4
      - run: make build APP=${{ matrix.app }}
